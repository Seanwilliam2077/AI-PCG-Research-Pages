{ label:"01 白盒生成管线", html:`
  <div class="sl">
    <p class="kick">01 · AI PCG 编辑器</p>
    <h2>白盒生成管线 — Create PCG Data</h2>
    <p class="lead">一张概念图进,一个可游走的白盒关卡出:「生图 — 矢量化 — 落地」三段数据流,全链可在无界面的编辑器进程里执行。</p>
    <div class="cols media">
      <div class="col"><img class="fig" src="assets/img/tri-photoreal.webp" alt="AI 生成的写实顶视图"><p class="step">① 生图</p><h3>三图供给</h3><p>文生图双通道产写实航拍、语义分块、灰度高度三图;提示词模板锁定 90° 正交顶视,支持笔刷蒙版 + 文字指令局部重绘。</p></div>
      <div class="col"><img class="fig" src="assets/img/tri-semantic.webp" alt="六类语义分块图(后处理)"><p class="step">② 矢量化</p><h3>语义图 → 布局数据</h3><p>按语义色提取建筑 / 道路 / 植被 / 水体 / 边界轮廓;另有精度优先通路直接产内存布局文档;角色比例节点推算真实世界尺度。</p></div>
      <div class="col"><img class="fig" src="assets/img/wm-whitebox.webp" alt="落地后的白盒场景渲染"><p class="step">③ 落地</p><h3>Create PCG Data</h3><p>高度图写入 Landscape,布局数据生成街区、地块与建筑白盒;统一摆放节点生成植物、围墙与道路,地形与街区共用同一标定。</p></div>
    </div>
    <div class="foot"><span>分帧执行 · 统一标定 · 失败隔离 · 统一摆放(贴地 / 陡坡 30° 禁植 / 崖边禁植)</span><a class="chip" style="margin-left:auto" href="${L_WB}"${EXT}>专题页:白盒生成管线 ↗</a></div>
  </div>` },

{ label:"批量白盒生产", html:`
  <div class="sl">

    <h2>BatchPCG — 无人值守批量</h2>
    <p class="lead">关键节点全部无头化(五个 Python 入口 + 重置与收敛轮询):维护一份 prompt 清单即可夜跑几百个场景。</p>
    <div style="display:grid;grid-template-columns:1.05fr 1fr;gap:44px;margin-block:auto;align-items:start">
      <table style="margin:0;font-size:19.5px">
        <thead><tr><th>产物</th><th>规格</th><th>说明</th></tr></thead>
        <tbody>
          <tr><td>生成图与布局</td><td class="num">3 图 + JSON</td><td>写实航拍 / 语义分块 / 高度图,布局文档随批落盘</td></tr>
          <tr><td>地形文件</td><td class="num">r16 + 16-bit PNG</td><td>附世界尺寸与高度标定、UE Landscape 导入四参数</td></tr>
          <tr><td>整景白模</td><td class="num">scene.obj</td><td>地形 / 地块 / 建筑 / 植物 / 围墙 / 道路六类分组</td></tr>
          <tr><td>磁盘预算</td><td class="num">20 – 35 GB</td><td>300 job 夜跑总量(Low 档);语义纯度低于 0.90 告警</td></tr>
        </tbody>
      </table>
      <div>
        <img class="fig" style="aspect-ratio:16/8" src="assets/img/flow-overview.webp" alt="六步管线总览流程图">
        <div class="ph" style="aspect-ratio:4/1">图片占位 — 待补:批产场景俯视截图 / report 汇总图</div>
      </div>
    </div>
    <div class="foot"><span>三阶段编排:云端生图 → 编辑器内状态机 → 汇总报告 · 每 25 job 重启编辑器 · 断点续跑 · 失败熔断 · 离屏真 GPU 渲染</span></div>
  </div>` },

{ label:"数据采集与视频批产", html:`
  <div class="sl">
    <p class="kick">01 · AI PCG 编辑器</p>
    <h2>数据采集与视频批产</h2>
    <p class="lead">批量能力的延伸:白盒之上自动运镜、无损渲染、坐标转换,按数据集契约落盘——原为世界模型训练数据设计,该方向未采纳落地,能力沉淀回本管线。</p>
    <div class="cols media">
      <div class="col"><img class="fig" src="assets/img/flow-camera.webp" alt="程序化运镜流程图"><p class="step">STAGE 1 · 2</p><h3>程序化运镜</h3><p>建筑群包围盒定轨道,orbit / dolly / crane 模版按 job 随机;内参与对焦显式固定,位姿按轨迹参数解析重算,无采样误差。</p></div>
      <div class="col"><img class="fig" src="assets/img/flow-render.webp" alt="MRQ 渲染与编码流程图"><p class="step">STAGE 3</p><h3>MRQ 无损渲染</h3><p>固定曝光、关运动模糊、空间采样抗锯齿;RGB 之外输出 32 位深度与法线,逐帧位姿写入 cameras.json 作数据真源。</p></div>
      <div class="col"><img class="fig" src="assets/img/flow-dataset.webp" alt="数据集契约与训练价值"><p class="step">STAGE 4 · 5</p><h3>坐标转换与打包</h3><p>UE 约定转 OpenCV 相机约定并以合成位姿单测;深度换米、内参换算 K;产物校验后按目录契约落盘,下游直接组装。</p></div>
    </div>
    <div class="foot"><span>rgb / depth / normal / cameras.json / capture_meta —— 目录 schema 即交付契约</span><a class="chip" style="margin-left:auto" href="${L_WM}"${EXT}>流程与视频 ↗</a></div>
  </div>` },

{ label:"02 GeoGen · 山体", html:`
  <div class="sl">
    <p class="kick">02 · AI PCG 编辑器</p>
    <h2>GeoGen — 山体一键生成链</h2>
    <p class="lead">地形 / 蒙版 / 城市 / 工具四套面板收进一个编辑器模式;近中景与远景两条路线各持一套流水线节点,互不覆盖。</p>
    <div class="cols media">
      <div class="col"><img class="fig" src="assets/img/gg-ref.webp" alt="合成的环绕顶视参考图"><p class="step">STEP 1 · 环绕参考图</p><h3>AI 合成顶视</h3><p>多张参考图合成「中央平地、四周环山」俯视图;笔刷蒙版 + 文字指令局部重绘,未涂抹像素逐字节保真。</p></div>
      <div class="col"><img class="fig" src="assets/img/gg-height.webp" alt="16-bit 高度图"><p class="step">STEP 2 · AI 高度图</p><h3>按海拔推理</h3><p>雪线读作高地、河谷读作最低;多图按生态特征排序,要求产出一块连续地形而非拼贴。</p></div>
      <div class="col"><img class="fig" src="assets/img/gg-biome.webp" alt="生态分布蒙版"><p class="step">STEP 3 · 侵蚀与蒙版</p><h3>沿冲刷纹理</h3><p>服务器侵蚀(1K 约 20 秒 / 2K 约 90 秒);生态蒙版刻意排在侵蚀后,沿真实冲刷纹理划分植被、岩石与积雪。</p></div>
    </div>
    <div class="foot"><span>四步产物全是图片、零副作用可无限重来;写地形、放图章、交接 Genesis 都刻意留在链外。</span></div>
  </div>` },

{ label:"GeoGen · 落地与植被", html:`
  <div class="sl">
    <p class="kick">02 · AI PCG 编辑器</p>
    <h2>GeoGen — 落地与植被</h2>
    <div class="cols media" style="margin-top:38px">
      <div class="col"><img class="fig" src="assets/img/gg-terrain.webp" alt="一键生成的裸地形"><p class="step">近中景落地</p><h3>面积直定</h3><p>地形面积由用户直接指定(上限 2500 km²),每格尺度现算,切分辨率档不漂移;边界包络坡角只削戳破处;交接 Genesis 按顶点数对齐导出。</p></div>
      <div class="col"><img class="fig" src="assets/img/gg-massing.webp" alt="地形体量与远景山"><p class="step">远景产物</p><h3>烘成网格</h3><p>默认烘成单一连续静态网格,移动旋转复制全是原生行为;「提取山峰」逐座抠峰散布地平线;同顶点数从 2 km 拉到 8 km,显存不变。</p></div>
      <div class="col"><img class="fig" src="assets/img/gg-veg.webp" alt="黄昏植被落地成果"><p class="step">植被生成</p><h3>生态分布图</h3><p>双来源各持独立结果;16 色蒙版一键导入 Genesis 为每层绑 PCG Graph;只跑 VegetationOnly、不改地形高度;贴地、陡坡 30° 与崖边禁植。</p></div>
    </div>
    <div class="foot"><span>植被侧「只跑 VegetationOnly」与山体侧「只跑权重图章」互为镜像</span><a class="chip" style="margin-left:auto" href="${L_GG}"${EXT}>专题页:GeoGen 山脉与植被 ↗</a></div>
  </div>` },

{ label:"03 AI PCG Scene", html:`
  <div class="sl">
    <p class="kick">03 · 开源</p>
    <h2>AI PCG Scene — 单图到场景的端到端</h2>
    <p class="lead">同一个命题做三遍:给一张参考图,自动生成一个三维场景。三条互相独立的实现互相印证,全部开源。</p>
    <div class="cols media">
      <div class="col"><img class="fig" style="aspect-ratio:16/6" src="assets/img/sc-compare.webp" alt="参考图与 UE5 重建的并排对照"><p class="step">线 1 · UE5 资产库匹配</p><h3>AI 提案,规则裁决</h3><p>UE 5.5 内嵌 Python 前馈管线:标定 → 布局 → 材质 → 匹配装配;阶段间只交换 JSON、可断点续跑;失配退化代理盒。127 actors / 0 报错 / 21 库命中 + 9 代理盒。</p></div>
      <div class="col"><img class="fig" style="aspect-ratio:16/6" src="assets/img/sc-fob.webp" alt="参考图与浏览器实时渲染对照"><p class="step">线 2 · three.js 程序化</p><h3>规则长出场景</h3><p>一张图拆成可生成的规则清单,几何与贴图全部运行时算出;同一份总平面被烘焙与摆放两处消费。44 897 构件 / 每帧 60 draw call,换个种子约 4 秒。</p></div>
      <div class="col"><img class="fig" style="aspect-ratio:16/6" src="assets/img/sc-calib.webp" alt="房间线框与地平线投影回参考图核对"><p class="step">线 3 · Blender 度量闭环</p><h3>像不像,可测量</h3><p>九轮「渲染 → 度量 → 定位病因 → 改」;消失点解相机、投影回原图逐点核对。边缘 F 0.260 → 0.650;与线 1 外参一比,地平线差 91 px。</p></div>
    </div>
    <div class="foot"><span>三份交互文档:拖动对比 · 逐步播放 · 图上探针 · 参数滑块</span><a class="chip" style="margin-left:auto" href="${L_SC}"${EXT}>仓库:github.com/Seanwilliam2077/AI-PCG-Scene ↗</a></div>
  </div>` },

{ label:"方法论与白盒 Live", html:`
  <div class="sl">
    <p class="kick">03 · 开源</p>
    <h2>方法论与白盒 Live</h2>
    <div class="cols two" style="margin-top:38px">
      <div class="col"><img class="fig" src="assets/img/sc-scatter.webp" alt="39 个模块估计尺寸与实测散点图"><p class="step">方法论</p><h3>语义走模型,几何走算法</h3><p>贯穿判据只有一条:模型擅长说「这是什么」,不擅长说「这有多大、在哪里」。39 个资产模块的估计尺寸全部挤在 75 – 118 cm 一条带里,与实测毫无关系;踩塌的结论按原样写进正文,数据可一键复跑导出。</p></div>
      <div class="col"><img class="fig" src="assets/img/sc-strip.webp" alt="输入图与解出的白盒及相机视锥"><p class="step">白盒 Live</p><h3>拖图进浏览器,当场出白盒</h3><p>LSD + RANSAC 解相机,深度模型以地面解析单应校成米制,按视差不连续切分体块,导出 GLB 直接进 DCC。推理与几何求解全部在浏览器本地完成,图片不上传,打开即用。</p></div>
    </div>
    <div class="foot"><span>三条补召回策略贡献 49/70 检出 · 39 模块实测最长边 75.0 – 117.8 cm</span><a class="chip" style="margin-left:auto" href="${L_WBL}"${EXT}>白盒 Live · 打开即用 ↗</a></div>
  </div>` },

{ label:"04 3DGS 场景重建", html:`
  <div class="sl">
    <p class="kick">04 · 前沿探索</p>
    <h2>3DGS — 游戏场景重建</h2>
    <p class="lead">沿烘焙 probe 点连线生成采集路径自动采数据,重建为编辑器内可查看的 3DGS 资产,并完成定制引擎的渲染集成验证;采集管线已迭代约 20 次。</p>
    <div class="cols two">
      <div class="col"><div class="ph">图片占位 — 待补:暗区场景 3DGS 重建效果截图(统一曝光 vs 自动曝光对比)</div><p class="step">问题 1 · 曝光一致性</p><h3>HDR 统一后处理</h3><p>统一曝光让暗部死黑,自动曝光让同区域帧间不一致。思路:HDR 采集 → exposure 调整 → tone mapping 压缩动态范围 → gamma / sRGB 转换。</p></div>
      <div class="col"><div class="ph">图片占位 — 待补:probe 采集路径示意图(后拉前 / 后拉后)</div><p class="step">问题 2 · 采集路径</p><h3>probe 后拉</h3><p>部分 probe 点离墙面过近影响重建;按 probe 特性把点整体向后拉,先采完暗区场景再统一对齐,预计还需几轮迭代。</p></div>
    </div>
    <div class="foot"><span>当前重建质量还不够好,瓶颈集中在这两处,仍在迭代。</span></div>
  </div>` },

{ label:"VortexGaussians", html:`
  <div class="sl">
    <p class="kick">04 · 前沿探索 · 公开研究</p>
    <h2>VortexGaussians</h2>
    <p class="lead">首个以实时前向物理模拟生成火焰烟雾、并作为原生 3DGS 内容渲染的系统:涡粒子与 3D 高斯同为一种点基元——无体素化、无网格化、无模拟到渲染的转换。</p>
    <div class="cols">
      <div class="col"><img class="fig" src="assets/img/vg-flame.webp" alt="VortexGaussians 火焰题图"><p class="step">统一基元</p><h3>粒子即高斯</h3><p>火焰与重建出的 3DGS 场景共享一个深度序,互相遮挡正确——烟雾能正确地绕过重建场景的梁柱。</p></div>
      <div class="col"><img class="fig" src="assets/img/vg-kitchen.webp" alt="厨房场景中的实时火焰"><p class="step">性能</p><h3>8.9 ms / 帧</h3><p>112 FPS,单文件 WebGL2 原型;模拟与渲染同帧完成,无离线烘焙。</p></div>
      <div class="col"><img class="fig" src="assets/img/vg-occl.webp" alt="烟雾与重建场景的正确遮挡"><p class="step">开放</p><h3>论文页 + Live Demo</h3><p>论文页、实时 Demo 与代码全部公开,浏览器直接跑。</p></div>
    </div>
    <div class="foot"><a class="chip" style="margin-left:auto" href="${L_VG}"${EXT}>专题页:seanwilliam2077.github.io/VortexGaussians ↗</a></div>
  </div>` },

{ label:"总结", html:`
  <div class="sl">
    <p class="kick">05 · Summary</p>
    <h2>总结 — 三个月做了什么</h2>

function show(i, push) {
  i = Math.max(0, Math.min(SLIDES.length - 1, i));

/* ─────────── final-page demo: seeded whitebox layout ─────────── */
let demoState = { stage: 0, seed: 20260831 };
function mulberry32(a) { return function() {
  a |= 0; a = a + 0x6D2B79F5 | 0;
  let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function genLayout(seed, roadGap, dens, vegP) {
  const R = mulberry32(seed), W = 640, H = 640;
  const vs = [], hs = [];
  for (let x = 60 + R() * roadGap; x < W - 40; x += roadGap * (0.75 + R() * 0.5)) vs.push(x);
  for (let y = 60 + R() * roadGap; y < H - 40; y += roadGap * (0.75 + R() * 0.5)) hs.push(y);
  const xs = [0, ...vs, W], ys = [0, ...hs, H];
  const cells = [];
  for (let i = 0; i + 1 < xs.length; i++) for (let j = 0; j + 1 < ys.length; j++) {
    const x0 = xs[i] + 8, y0 = ys[j] + 8, w = xs[i + 1] - xs[i] - 16, h = ys[j + 1] - ys[j] - 16;
    if (w < 34 || h < 34) continue;
    const r = R();
    let kind = 'lots';
    if (r < 0.07) kind = 'water'; else if (r < 0.07 + vegP / 100 * 0.55) kind = 'park';
    const cell = { x: x0, y: y0, w, h, kind, walled: kind === 'lots' && R() < 0.22, bld: [], trees: [] };
    if (kind === 'lots') {
      const nx = Math.max(1, Math.round(w / 64)), ny = Math.max(1, Math.round(h / 64));
      for (let a = 0; a < nx; a++) for (let b = 0; b < ny; b++) {
        if (R() * 100 > dens) continue;
        const lw = w / nx, lh = h / ny;
        const bw = lw * (0.45 + R() * 0.4), bh = lh * (0.45 + R() * 0.4);
        cell.bld.push({ x: x0 + a * lw + (lw - bw) / 2 + (R() - 0.5) * 6,
                        y: y0 + b * lh + (lh - bh) / 2 + (R() - 0.5) * 6,
                        w: bw, h: bh, z: 18 + R() * R() * 85 });
      }
      if (!cell.bld.length) cell.kind = 'park';
    }
    if (cell.kind === 'park') {
      const n = 4 + Math.floor(R() * 12 * (0.4 + vegP / 100));
      for (let t = 0; t < n; t++) cell.trees.push({ x: x0 + 8 + R() * (w - 16), y: y0 + 8 + R() * (h - 16), r: 4 + R() * 6 });
    }
    cells.push(cell);
  }
  return { W, H, vs, hs, cells };
}

function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

function drawSem(cx, L, mode) {
  const { W, H } = L, s = cx.canvas.width / W;
  cx.save(); cx.scale(s, s * (cx.canvas.height / cx.canvas.width) * (W / H));
  cx.fillStyle = cssVar('--c-ground'); cx.globalAlpha = mode === 1 ? 0.34 : 1;
  cx.fillRect(0, 0, W, H);
  cx.fillStyle = cssVar('--c-road');
  for (const x of L.vs) cx.fillRect(x - 7, 0, 14, H);
  for (const y of L.hs) cx.fillRect(0, y - 7, W, 14);
  for (const c of L.cells) {
    if (c.kind === 'water') { cx.fillStyle = cssVar('--c-water'); cx.fillRect(c.x, c.y, c.w, c.h); }
    if (c.kind === 'park') { cx.fillStyle = cssVar('--c-veg');
      for (const t of c.trees) { cx.beginPath(); cx.arc(t.x, t.y, t.r, 0, 7); cx.fill(); } }
    if (c.walled) { cx.strokeStyle = cssVar('--c-wall'); cx.lineWidth = 3; cx.strokeRect(c.x, c.y, c.w, c.h); }
    cx.fillStyle = cssVar('--c-building');
    for (const b of c.bld) cx.fillRect(b.x, b.y, b.w, b.h);
  }
  cx.globalAlpha = 1;
  if (mode === 1) { /* vector overlay */
    cx.strokeStyle = '#f5efe2'; cx.lineWidth = 1.6; cx.setLineDash([7, 5]);
    for (const c of L.cells) for (const b of c.bld) cx.strokeRect(b.x, b.y, b.w, b.h);
    cx.setLineDash([]);
    cx.strokeStyle = cssVar('--accent'); cx.lineWidth = 2.2;
    for (const c of L.cells) cx.strokeRect(c.x, c.y, c.w, c.h);
    cx.fillStyle = cssVar('--accent');
    for (const c of L.cells) for (const b of c.bld) { cx.beginPath(); cx.arc(b.x, b.y, 3.4, 0, 7); cx.fill(); }
  }
  cx.restore();
}

function drawIso(cx, L, ghost) {
  const cw = cx.canvas.width, ch = cx.canvas.height;
  cx.clearRect(0, 0, cw, ch);
  const { W, H } = L;
  const px = (x, y, z) => {
    const u = (x - y) / Math.SQRT2, v = (x + y) / (2 * Math.SQRT2) - z;
    return [cw / 2 + u * (cw / (W * 1.55)), ch * 0.24 + v * (ch / (H * 1.18))];
  };
  const quad = (p, fill, stroke) => { cx.beginPath(); cx.moveTo(...p[0]);
    for (let i = 1; i < p.length; i++) cx.lineTo(...p[i]);
    cx.closePath(); if (fill) { cx.fillStyle = fill; cx.fill(); }
    if (stroke) { cx.strokeStyle = stroke; cx.lineWidth = 1; cx.stroke(); } };
  quad([px(0,0,0), px(W,0,0), px(W,H,0), px(0,H,0)], ghost ? '#241f16' : '#3a2f4c');
  cx.globalAlpha = ghost ? 0.35 : 1;
  cx.fillStyle = '#4a4a4a';
  for (const x of L.vs) quad([px(x-7,0,0), px(x+7,0,0), px(x+7,H,0), px(x-7,H,0)], '#3c3c3c');
  for (const y of L.hs) quad([px(0,y-7,0), px(0,y+7,0), px(W,y+7,0), px(W,y-7,0)], '#3c3c3c');
  for (const c of L.cells) {
    if (c.kind === 'water') quad([px(c.x,c.y,0), px(c.x+c.w,c.y,0), px(c.x+c.w,c.y+c.h,0), px(c.x,c.y+c.h,0)], '#0f6a74');
  }
  cx.globalAlpha = 1;
  if (!ghost) {
    const items = [];
    for (const c of L.cells) {
      for (const b of c.bld) items.push({ d: b.x + b.y, f: () => {
        const {x, y, w, h, z} = b;
        quad([px(x,y+h,0), px(x+w,y+h,0), px(x+w,y+h,z)], null);
        quad([px(x,y+h,z), px(x+w,y+h,z), px(x+w,y+h,0), px(x,y+h,0)], '#8f3030');
        quad([px(x+w,y,z), px(x+w,y+h,z), px(x+w,y+h,0), px(x+w,y,0)], '#b74040');
        quad([px(x,y,z), px(x+w,y,z), px(x+w,y+h,z), px(x,y+h,z)], '#e0dcd2', '#8a867c');
      }});
      for (const t of c.trees) items.push({ d: t.x + t.y, f: () => {
        const [bx, by] = px(t.x, t.y, 0);
        cx.fillStyle = '#2E8B2E'; cx.beginPath();
        cx.moveTo(bx, by - t.r * 3.2); cx.lineTo(bx - t.r, by); cx.lineTo(bx + t.r, by);
        cx.closePath(); cx.fill();
      }});
    }
    items.sort((a, b) => a.d - b.d).forEach(i => i.f());
  }
}

function runDemo() {
  const sem = document.getElementById('cvSem'), iso = document.getElementById('cvIso');
  if (!sem) return;
  for (const c of [sem, iso]) {
    const r = c.getBoundingClientRect(), d = devicePixelRatio || 1;
    c.width = Math.max(60, r.width * d); c.height = Math.max(60, r.height * d);
  }
  const road = +document.getElementById('rgRoad').value;
  const dens = +document.getElementById('rgDens').value;
  const veg = +document.getElementById('rgVeg').value;
  const L = genLayout(demoState.seed, road, dens, veg);
  const st = demoState.stage;
  const cxS = sem.getContext('2d'); cxS.clearRect(0, 0, sem.width, sem.height);
  drawSem(cxS, L, st === 1 ? 1 : 0);
  drawIso(iso.getContext('2d'), L, st < 2);
  let nb = 0, nt = 0, nc = L.cells.length;
  for (const c of L.cells) { nb += c.bld.length; nt += c.trees.length; }
  document.getElementById('demoStat').textContent =
    `seed ${demoState.seed} · ${nc} 街区 · ${nb} 建筑 · ${nt} 植被`;
}
function initDemo() {
  demoState.stage = 0;
  document.querySelectorAll('.demo button.st[data-st]').forEach(b => {
    b.classList.toggle('on', b.dataset.st === '0');
    b.onclick = () => { demoState.stage = +b.dataset.st;
      document.querySelectorAll('.demo button.st[data-st]').forEach(x =>
        x.classList.toggle('on', x === b)); runDemo(); };
  });
  document.getElementById('btnSeed').onclick = () => {
    demoState.seed = 1 + Math.floor(Math.random() * 99999999); runDemo(); };
  for (const id of ['rgRoad', 'rgDens', 'rgVeg'])
    document.getElementById(id).oninput = runDemo;
  runDemo();
  setTimeout(runDemo, 120); // fonts/layout settle; rAF may be throttled in hidden panes
}
addEventListener('resize', () => { if (cur === SLIDES.length - 1) runDemo(); });

const n0 = parseInt(location.hash.slice(1));
show(n0 ? n0 - 1 : 0, false);
