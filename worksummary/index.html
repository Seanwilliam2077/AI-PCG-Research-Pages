        <tr><td>地形文件</td><td class="num">r16 + 16-bit PNG</td><td>附世界尺寸与高度标定、UE Landscape 导入四参数</td></tr>
        <tr><td>整景白模</td><td class="num">scene.obj</td><td>地形 / 地块 / 建筑 / 植物 / 围墙 / 道路六类分组</td></tr>
        <tr><td>磁盘预算</td><td class="num">20 – 35 GB</td><td>300 job 夜跑总量(Low 档);语义纯度低于 0.90 告警</td></tr>
      </tbody>
    </table>
    <div class="foot"><span>三阶段编排:云端生图 → 编辑器内状态机 → 汇总报告 · 每 25 job 重启编辑器 · 断点续跑 · 失败熔断 · 离屏真 GPU 渲染</span></div>
  </div>`,
  notes:["BatchPCG 一条命令无人值守:摄取 prompt → 云端生图 → 分片编辑器状态机 → 汇总报告。每 25 个 job 重启编辑器规避内存累积;断点续跑、失败熔断、启动预检。","「万能顶视图框架」由 LLM 按主题产异质化组合,近无限 prompt 供给。批量能力让白盒从单个 demo 变成可规模化供给的资产来源。"],

{ label:"数据采集与视频批产", html:`
  <div class="sl">
    <p class="kick">01 · AI PCG 编辑器</p>
    <h2>数据采集与视频批产</h2>
    <p class="lead">批量能力的延伸:白盒之上自动运镜、无损渲染、坐标转换,按数据集契约落盘——原为世界模型训练数据设计,该方向未采纳落地,能力沉淀回本管线。</p>
    <div class="cols">
      <div class="col"><p class="step">STAGE 1 · 2</p><h3>程序化运镜</h3><p>建筑群包围盒定轨道,orbit / dolly / crane 模版按 job 随机;内参与对焦显式固定,位姿按轨迹参数解析重算,无采样误差。</p></div>
      <div class="col"><p class="step">STAGE 3</p><h3>MRQ 无损渲染</h3><p>固定曝光、关运动模糊、空间采样抗锯齿;RGB 之外输出 32 位深度与法线,逐帧位姿写入 cameras.json 作数据真源。</p></div>
      <div class="col"><p class="step">STAGE 4 · 5</p><h3>坐标转换与打包</h3><p>UE 约定转 OpenCV 相机约定并以合成位姿单测;深度换米、内参换算 K;产物校验后按目录契约落盘,下游直接组装。</p></div>
    </div>
    <div class="foot"><span>rgb / depth / normal / cameras.json / capture_meta —— 目录 schema 即交付契约</span></div>
  </div>`,
  notes:["五阶段全部用编辑器内 Python 实现,不动 C++、不碰节点管线。","一键视频批产:浏览器输入 fps / 数量 / 时长即自动跑完「LLM 组合 → 三图 → PCG 白盒 → 运镜渲染 → mp4 落盘」全链;动态容量按质检现算,拍满即切、拍够即停;崩溃超时不废批。","最后一页可直接播放全流程录屏与成片效果。"],
  links:[["管线一详页:流程与视频",L_WM]] },

{ label:"02 GeoGen · 山体", html:`
  <div class="sl">
    <p class="kick">02 · AI PCG 编辑器</p>
    <h2>GeoGen — 山体一键生成链</h2>
    <p class="lead">地形 / 蒙版 / 城市 / 工具四套面板收进一个编辑器模式;近中景与远景两条路线各持一套流水线节点,互不覆盖。</p>
    <div class="cols">
      <div class="col"><p class="step">STEP 1 · 环绕参考图</p><h3>AI 合成顶视</h3><p>多张参考图合成「中央平地、四周环山」俯视图;笔刷蒙版 + 文字指令局部重绘,未涂抹像素逐字节保真。</p></div>
      <div class="col"><p class="step">STEP 2 · AI 高度图</p><h3>按海拔推理</h3><p>雪线读作高地、河谷读作最低;多图按生态特征排序,要求产出一块连续地形而非拼贴。</p></div>
      <div class="col"><p class="step">STEP 3 · 侵蚀与蒙版</p><h3>沿冲刷纹理</h3><p>服务器侵蚀(1K 约 20 秒 / 2K 约 90 秒);生态蒙版刻意排在侵蚀后,沿真实冲刷纹理划分植被、岩石与积雪。</p></div>
    </div>
    <div class="foot"><span>四步产物全是图片、零副作用可无限重来;写地形、放图章、交接 Genesis 都刻意留在链外。</span></div>
  </div>`,
  notes:["GeoGen 补齐大世界的地形与生态环节:白盒解决街区,山体与植被此前仍靠手工雕刻。","编辑器模式观感对齐 Modeling Mode,机制自绘,三套既有业务逻辑一行未改;反复调远山不会覆盖近景结果。"],
  links:[["专题页:GeoGen 山脉与植被",L_GG]] },

{ label:"GeoGen · 落地与植被", html:`
  <div class="sl">
    <p class="kick">02 · AI PCG 编辑器</p>
    <h2>GeoGen — 落地与植被</h2>
    <div class="cols" style="margin-top:34px">
      <div class="col"><p class="step">近中景落地</p><h3>面积直定</h3><p>地形面积由用户直接指定(上限 2500 km²),每格尺度现算,切分辨率档不漂移;边界包络坡角只削戳破处;交接 Genesis 按顶点数对齐导出。</p></div>

    </div>
    <div class="foot"><span class="chip">专题页:GeoGen — 生成过程与编辑器演示 →</span></div>
  </div>`,
  notes:["近中景与远景互为镜像:植被侧「只跑 VegetationOnly」对应山体侧「只跑权重图章」。","专题页里有可划拉的生态分布擦除对比和完整操作录屏(从切模式、导参考图到一键落地形,整段无剪辑)——也收进了最后一页的操作台。"],
  links:[["专题页:GeoGen 山脉与植被",L_GG]] },

{ label:"03 AI PCG Scene", html:`
  <div class="sl">
    <p class="kick">03 · 开源</p>
    <h2>AI PCG Scene — 单图到场景的端到端</h2>
    <p class="lead">同一个命题做三遍:给一张参考图,自动生成一个三维场景。三条互相独立的实现互相印证,全部开源。</p>
    <div class="cols">
      <div class="col"><p class="step">线 1 · UE5 资产库匹配</p><h3>AI 提案,规则裁决</h3><p>UE 5.5 内嵌 Python 前馈管线:标定 → 布局 → 材质 → 匹配装配;阶段间只交换 JSON、可断点续跑;失配退化代理盒。127 actors / 0 报错 / 21 库命中 + 9 代理盒。</p></div>
      <div class="col"><p class="step">线 2 · three.js 程序化</p><h3>规则长出场景</h3><p>一张图拆成可生成的规则清单,几何与贴图全部运行时算出;同一份总平面被烘焙与摆放两处消费。44 897 构件 / 每帧 60 draw call,换个种子约 4 秒。</p></div>
      <div class="col"><p class="step">线 3 · Blender 度量闭环</p><h3>像不像,可测量</h3><p>九轮「渲染 → 度量 → 定位病因 → 改」;消失点解相机、投影回原图逐点核对。边缘 F 0.260 → 0.650;与线 1 外参一比,地平线差 91 px。</p></div>
    </div>
    <div class="foot"><span class="chip">仓库与交互文档:github.com/Seanwilliam2077/AI-PCG-Scene →</span></div>
  </div>`,
  notes:["三份文档都是可动手的交互页:拖动对比、逐步播放、图上探针、可筛选表、参数滑块。","线 1 与线 3 用同一张室内参考图与同一批资产,可定量对照;线 2 用另一张图(沙漠基地),只比方法结构——可比性边界写在 README 里。"],
  links:[["GitHub 仓库",L_SC],["交互文档站点",L_SCP],["白盒 Live(打开即用)",L_WBL]] },

{ label:"方法论与白盒 Live", html:`
  <div class="sl">
    <p class="kick">03 · 开源</p>
    <h2>方法论与白盒 Live</h2>
    <div class="cols two" style="margin-top:34px">
      <div class="col"><p class="step">方法论</p><h3>语义走模型,几何走算法</h3><p>贯穿判据只有一条:模型擅长说「这是什么」,不擅长说「这有多大、在哪里」。39 个资产模块的估计尺寸全部挤在 75 – 118 cm 一条带里,与实测毫无关系;踩塌的结论按原样写进正文,数据可一键复跑导出。</p></div>
      <div class="col"><p class="step">白盒 Live</p><h3>拖图进浏览器,当场出白盒</h3><p>LSD + RANSAC 解相机,深度模型以地面解析单应校成米制,按视差不连续切分体块,导出 GLB 直接进 DCC。推理与几何求解全部在浏览器本地完成,图片不上传,打开即用。</p></div>
    </div>
    <div class="foot"><span>三条补召回策略贡献 49/70 检出 · 39 模块实测最长边 75.0 – 117.8 cm · 数据可复跑导出</span></div>
  </div>`,
  notes:["方法论不绑定本仓库代码,换个项目也照做得出来:图像的识别与分割、对应资产的生成、DCC 里的相机还原与位姿估计。","白盒 Live 在最后一页的操作台里可以直接打开——纯静态托管,推理走 WebGPU / WASM。"],
  links:[["白盒 Live(打开即用)",L_WBL],["交互文档站点",L_SCP]] },

{ label:"04 3DGS 场景重建", html:`
  <div class="sl">
    <p class="kick">04 · 前沿探索</p>
    <h2>3DGS — 游戏场景重建</h2>
    <p class="lead">沿烘焙 probe 点连线生成采集路径自动采数据,重建为编辑器内可查看的 3DGS 资产,并完成定制引擎的渲染集成验证;采集管线已迭代约 20 次。</p>
    <div class="cols two">
      <div class="col"><p class="step">问题 1 · 曝光一致性</p><h3>HDR 统一后处理</h3><p>统一曝光让暗部死黑,自动曝光让同区域帧间不一致。思路:HDR 采集 → exposure 调整 → tone mapping 压缩动态范围 → gamma / sRGB 转换。</p></div>
      <div class="col"><p class="step">问题 2 · 采集路径</p><h3>probe 后拉</h3><p>部分 probe 点离墙面过近影响重建;按 probe 特性把点整体向后拉,先采完暗区场景再统一对齐,预计还需几轮迭代。</p></div>
    </div>
    <div class="foot"><span>当前重建质量还不够好,瓶颈集中在这两处,仍在迭代。</span></div>
  </div>`,
  notes:["探索把游戏场景变成 3DGS 表达:不涉及真实设备,数据全部来自引擎内。","单轮采集很快;重建质量的两处瓶颈(曝光一致性、probe 路径)是下一步的迭代重点。"],
  links:[["VortexGaussians 专题页",L_VG]] },

/* ─────────── shell: render / nav ─────────── */
const cv = document.getElementById('cv'), stage = document.getElementById('stage');
const notesBody = document.getElementById('notesBody');
const pgNow = document.getElementById('pgNow'), pgAll = document.getElementById('pgAll');
const prog = document.querySelector('#prog i');
let cur = -1;
pgAll.textContent = SLIDES.length;

function fit() {
  const r = stage.getBoundingClientRect();
  cv.style.transform = 'scale(' + (r.width / 1600) + ')';
}
addEventListener('resize', fit);

function esc(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function show(i, push) {
  i = Math.max(0, Math.min(SLIDES.length - 1, i));
  if (i === cur) return;
  cur = i;
  const S = SLIDES[i];
  cv.innerHTML = S.html;
  if (S.ov) {
    const box = cv.querySelector('#ovList');
    box.innerHTML = S.ov.map(o =>
      `<div data-go="${o[3]}" style="display:flex;gap:26px;align-items:baseline;padding:21px 6px;border-bottom:1px solid var(--line);cursor:pointer">
        <span style="font-size:17px;color:var(--accent);font-variant-numeric:tabular-nums">${o[0]}</span>
        <span style="font-size:26px;font-family:var(--serif)">${o[1]}</span>
        <span style="margin-left:auto;font-size:15px;color:var(--muted)">${o[2]}</span></div>`).join('');
    box.querySelectorAll('[data-go]').forEach(el =>
      el.addEventListener('click', () => show(+el.dataset.go, true)));
  }
  notesBody.innerHTML = S.notes.map(p => '<p>' + esc(p) + '</p>').join('') +
    (S.links.length ? '<div class="lks">' + S.links.map(l =>
      `<a href="${l[1]}"${/^http/.test(l[1]) ? ' target="_blank" rel="noopener"' : ''}>${esc(l[0])}</a>`).join('') + '</div>' : '');
  pgNow.textContent = i + 1;
  prog.style.width = ((i + 1) / SLIDES.length * 100) + '%';
  document.getElementById('btnPrev').disabled = i === 0;
  document.getElementById('btnNext').disabled = i === SLIDES.length - 1;
  document.querySelectorAll('#tocList button').forEach((b, k) => b.classList.toggle('on', k === i));
  document.title = '工作总结 · 第 ' + (i + 1) + '/' + SLIDES.length + ' 页';
  if (push !== false) history.replaceState(null, '', '#' + (i + 1));
  fit();
  if (i === SLIDES.length - 1) initDemo();
}
document.getElementById('btnPrev').addEventListener('click', () => show(cur - 1));
document.getElementById('btnNext').addEventListener('click', () => show(cur + 1));
addEventListener('keydown', e => {
  if (e.target.matches('input,textarea')) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); show(cur + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); show(cur - 1); }
  else if (e.key === 'Home') show(0);
  else if (e.key === 'End') show(SLIDES.length - 1);
});
addEventListener('hashchange', () => { const n = parseInt(location.hash.slice(1)); if (n) show(n - 1, false); });

/* TOC */
const toc = document.getElementById('toc'), mask = document.getElementById('tocMask');
document.getElementById('tocList').innerHTML = SLIDES.map((s, i) =>
  `<button><i>${String(i + 1).padStart(2, '0')}</i>${s.label}</button>`).join('');
document.querySelectorAll('#tocList button').forEach((b, i) =>
  b.addEventListener('click', () => { show(i); toggleToc(false); }));
function toggleToc(on) {
  const v = on === undefined ? !toc.classList.contains('on') : on;
  toc.classList.toggle('on', v); mask.classList.toggle('on', v);
}
document.getElementById('btnToc').addEventListener('click', () => toggleToc());
mask.addEventListener('click', () => toggleToc(false));

/* ─────────── final-page demo: seeded whitebox layout ─────────── */
let demoState = { stage: 0, seed: 20260831 };
function mulberry32(a) { return function() {
  a |= 0; a = a + 0x6D2B79F5 | 0;
  let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function genLayout(seed, roadGap, dens, vegP) {
  const R = mulberry32(seed), W = 640, H = 640;
  const vs = [], hs = [];
  for (let x = 60 + R() * roadGap; x < W - 40; x += roadGap * (0.75 + R() * 0.5)) vs.push(x);
  for (let y = 60 + R() * roadGap; y < H - 40; y += roadGap * (0.75 + R() * 0.5)) hs.push(y);
  const xs = [0, ...vs, W], ys = [0, ...hs, H];
  const cells = [];
  for (let i = 0; i + 1 < xs.length; i++) for (let j = 0; j + 1 < ys.length; j++) {
    const x0 = xs[i] + 8, y0 = ys[j] + 8, w = xs[i + 1] - xs[i] - 16, h = ys[j + 1] - ys[j] - 16;
    if (w < 34 || h < 34) continue;
    const r = R();
    let kind = 'lots';
    if (r < 0.07) kind = 'water'; else if (r < 0.07 + vegP / 100 * 0.55) kind = 'park';
    const cell = { x: x0, y: y0, w, h, kind, walled: kind === 'lots' && R() < 0.22, bld: [], trees: [] };
    if (kind === 'lots') {
      const nx = Math.max(1, Math.round(w / 64)), ny = Math.max(1, Math.round(h / 64));
      for (let a = 0; a < nx; a++) for (let b = 0; b < ny; b++) {
        if (R() * 100 > dens) continue;
        const lw = w / nx, lh = h / ny;
        const bw = lw * (0.45 + R() * 0.4), bh = lh * (0.45 + R() * 0.4);
        cell.bld.push({ x: x0 + a * lw + (lw - bw) / 2 + (R() - 0.5) * 6,
                        y: y0 + b * lh + (lh - bh) / 2 + (R() - 0.5) * 6,
                        w: bw, h: bh, z: 18 + R() * R() * 85 });
      }
      if (!cell.bld.length) cell.kind = 'park';
    }
    if (cell.kind === 'park') {
      const n = 4 + Math.floor(R() * 12 * (0.4 + vegP / 100));
      for (let t = 0; t < n; t++) cell.trees.push({ x: x0 + 8 + R() * (w - 16), y: y0 + 8 + R() * (h - 16), r: 4 + R() * 6 });
    }
    cells.push(cell);
  }
  return { W, H, vs, hs, cells };
}

function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

function drawSem(cx, L, mode) {
  const { W, H } = L, s = cx.canvas.width / W;
  cx.save(); cx.scale(s, s * (cx.canvas.height / cx.canvas.width) * (W / H));
  cx.fillStyle = cssVar('--c-ground'); cx.globalAlpha = mode === 1 ? 0.34 : 1;
  cx.fillRect(0, 0, W, H);
  cx.fillStyle = cssVar('--c-road');
  for (const x of L.vs) cx.fillRect(x - 7, 0, 14, H);
  for (const y of L.hs) cx.fillRect(0, y - 7, W, 14);
  for (const c of L.cells) {
    if (c.kind === 'water') { cx.fillStyle = cssVar('--c-water'); cx.fillRect(c.x, c.y, c.w, c.h); }
    if (c.kind === 'park') { cx.fillStyle = cssVar('--c-veg');
      for (const t of c.trees) { cx.beginPath(); cx.arc(t.x, t.y, t.r, 0, 7); cx.fill(); } }
    if (c.walled) { cx.strokeStyle = cssVar('--c-wall'); cx.lineWidth = 3; cx.strokeRect(c.x, c.y, c.w, c.h); }
    cx.fillStyle = cssVar('--c-building');
    for (const b of c.bld) cx.fillRect(b.x, b.y, b.w, b.h);
  }
  cx.globalAlpha = 1;
  if (mode === 1) { /* vector overlay */
    cx.strokeStyle = '#f5efe2'; cx.lineWidth = 1.6; cx.setLineDash([7, 5]);
    for (const c of L.cells) for (const b of c.bld) cx.strokeRect(b.x, b.y, b.w, b.h);
    cx.setLineDash([]);
    cx.strokeStyle = cssVar('--accent'); cx.lineWidth = 2.2;
    for (const c of L.cells) cx.strokeRect(c.x, c.y, c.w, c.h);
    cx.fillStyle = cssVar('--accent');
    for (const c of L.cells) for (const b of c.bld) { cx.beginPath(); cx.arc(b.x, b.y, 3.4, 0, 7); cx.fill(); }
  }
  cx.restore();
}

function drawIso(cx, L, ghost) {
  const cw = cx.canvas.width, ch = cx.canvas.height;
  cx.clearRect(0, 0, cw, ch);
  const { W, H } = L;
  const px = (x, y, z) => {
    const u = (x - y) / Math.SQRT2, v = (x + y) / (2 * Math.SQRT2) - z;
    return [cw / 2 + u * (cw / (W * 1.55)), ch * 0.24 + v * (ch / (H * 1.18))];
  };
  const quad = (p, fill, stroke) => { cx.beginPath(); cx.moveTo(...p[0]);
    for (let i = 1; i < p.length; i++) cx.lineTo(...p[i]);
    cx.closePath(); if (fill) { cx.fillStyle = fill; cx.fill(); }
    if (stroke) { cx.strokeStyle = stroke; cx.lineWidth = 1; cx.stroke(); } };
  quad([px(0,0,0), px(W,0,0), px(W,H,0), px(0,H,0)], ghost ? '#241f16' : '#3a2f4c');
  cx.globalAlpha = ghost ? 0.35 : 1;
  cx.fillStyle = '#4a4a4a';
  for (const x of L.vs) quad([px(x-7,0,0), px(x+7,0,0), px(x+7,H,0), px(x-7,H,0)], '#3c3c3c');
  for (const y of L.hs) quad([px(0,y-7,0), px(0,y+7,0), px(W,y+7,0), px(W,y-7,0)], '#3c3c3c');
  for (const c of L.cells) {
    if (c.kind === 'water') quad([px(c.x,c.y,0), px(c.x+c.w,c.y,0), px(c.x+c.w,c.y+c.h,0), px(c.x,c.y+c.h,0)], '#0f6a74');
  }
  cx.globalAlpha = 1;
  if (!ghost) {
    const items = [];
    for (const c of L.cells) {
      for (const b of c.bld) items.push({ d: b.x + b.y, f: () => {
        const {x, y, w, h, z} = b;
        quad([px(x,y+h,0), px(x+w,y+h,0), px(x+w,y+h,z)], null);
        quad([px(x,y+h,z), px(x+w,y+h,z), px(x+w,y+h,0), px(x,y+h,0)], '#8f3030');
        quad([px(x+w,y,z), px(x+w,y+h,z), px(x+w,y+h,0), px(x+w,y,0)], '#b74040');
        quad([px(x,y,z), px(x+w,y,z), px(x+w,y+h,z), px(x,y+h,z)], '#e0dcd2', '#8a867c');
      }});
      for (const t of c.trees) items.push({ d: t.x + t.y, f: () => {
        const [bx, by] = px(t.x, t.y, 0);
        cx.fillStyle = '#2E8B2E'; cx.beginPath();
        cx.moveTo(bx, by - t.r * 3.2); cx.lineTo(bx - t.r, by); cx.lineTo(bx + t.r, by);
        cx.closePath(); cx.fill();
      }});
    }
    items.sort((a, b) => a.d - b.d).forEach(i => i.f());
  }
}

function runDemo() {
  const sem = document.getElementById('cvSem'), iso = document.getElementById('cvIso');
  if (!sem) return;
  for (const c of [sem, iso]) {
    const r = c.getBoundingClientRect(), d = devicePixelRatio || 1;
    c.width = Math.max(60, r.width * d); c.height = Math.max(60, r.height * d);
  }
  const road = +document.getElementById('rgRoad').value;
  const dens = +document.getElementById('rgDens').value;
  const veg = +document.getElementById('rgVeg').value;
  const L = genLayout(demoState.seed, road, dens, veg);
  const st = demoState.stage;
  const cxS = sem.getContext('2d'); cxS.clearRect(0, 0, sem.width, sem.height);
  drawSem(cxS, L, st === 1 ? 1 : 0);
  drawIso(iso.getContext('2d'), L, st < 2);
  let nb = 0, nt = 0, nc = L.cells.length;
  for (const c of L.cells) { nb += c.bld.length; nt += c.trees.length; }
  document.getElementById('demoStat').textContent =
    `seed ${demoState.seed} · ${nc} 街区 · ${nb} 建筑 · ${nt} 植被`;
}
function initDemo() {
  demoState.stage = 0;
  document.querySelectorAll('.demo button.st[data-st]').forEach(b => {
    b.classList.toggle('on', b.dataset.st === '0');
    b.onclick = () => { demoState.stage = +b.dataset.st;
      document.querySelectorAll('.demo button.st[data-st]').forEach(x =>
        x.classList.toggle('on', x === b)); runDemo(); };
  });
  document.getElementById('btnSeed').onclick = () => {
    demoState.seed = 1 + Math.floor(Math.random() * 99999999); runDemo(); };
  for (const id of ['rgRoad', 'rgDens', 'rgVeg'])
    document.getElementById(id).oninput = runDemo;
  runDemo();
  setTimeout(runDemo, 120); // fonts/layout settle; rAF may be throttled in hidden panes
}
addEventListener('resize', () => { if (cur === SLIDES.length - 1) runDemo(); });

const n0 = parseInt(location.hash.slice(1));
show(n0 ? n0 - 1 : 0, false);
</script>
