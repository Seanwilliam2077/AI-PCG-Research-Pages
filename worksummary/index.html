{ label:"01 白盒生成管线", html:`

      <div>
        <p class="lead" style="font-size:21.5px;margin-bottom:20px">一张概念图进,一个可游走的白盒关卡出:「生图 — 矢量化 — 落地」三段数据流,全链可在无界面的编辑器进程里执行。拖动左侧分割线,对比同一场景的原图与各阶段产物。</p>
        <p style="font-size:18px;line-height:1.66;color:#c9c0ae;border-top:1px solid var(--line);padding-top:13px"><b style="color:var(--accent);font-weight:600">生图。</b>文生图双通道产写实航拍、语义分块、灰度高度三图;提示词模板锁定 90° 正交顶视,支持笔刷蒙版 + 文字指令局部重绘。</p>

      </div>
    </div>
    <div class="foot"><span>分帧执行 · 统一标定 · 失败隔离 · 统一摆放</span><a class="chip" style="margin-left:auto" href="${L_WB}"${EXT}>专题页:白盒生成管线 ↗</a></div>
  </div>` },

{ label:"批量白盒生产", html:`

      <img class="fig" style="aspect-ratio:1450/795;margin:0;object-fit:contain" src="assets/img/batch-poi.webp" alt="report 批量生图:白盒特定角度 → 多种风格效果参考,供策划与美术预览未来关卡(点击放大)">

  </div>` },

{ label:"世界模型自动化管线", html:`
  <div class="sl">
    <p class="kick">01 · AI PCG 编辑器</p>
    <h2>世界模型自动化管线</h2>
    <p class="lead">产物按数据集契约交付 —— 原为世界模型训练数据设计,方向未采纳,批量与自动化能力沉淀回白盒管线。</p>
    <img class="fig" style="aspect-ratio:1863/351;margin:22px 0 0;object-fit:contain;background:#f4f1fa" src="assets/img/flow-strip.webp" alt="六步全链:LLM 提示词组合 → AI 三图生成 → PCG 场景白盒 → 自动相机漫游 → MRQ 渲染 → 编码输出">
    <div class="cols media">
      <div class="col"><p class="step">STAGE 1 · 2</p><h3>程序化运镜</h3><p>建筑群包围盒定轨道,orbit / dolly / crane 模版按 job 随机;内参与对焦显式固定,位姿按轨迹参数解析重算,无采样误差。</p></div>
      <div class="col"><p class="step">STAGE 3</p><h3>MRQ 无损渲染</h3><p>固定曝光、关运动模糊、空间采样抗锯齿;RGB 之外输出 32 位深度与法线,逐帧位姿写入 cameras.json 作数据真源。</p></div>
      <div class="col"><p class="step">STAGE 4 · 5</p><h3>坐标转换与打包</h3><p>UE 约定转 OpenCV 相机约定并以合成位姿单测;深度换米、内参换算 K;产物校验后按目录契约落盘,下游直接组装。</p></div>
    </div>
    <div class="foot"><span>rgb / depth / normal / cameras.json / capture_meta —— 目录 schema 即交付契约</span><a class="chip" style="margin-left:auto" href="${L_WM}"${EXT}>流程与视频 ↗</a></div>
  </div>` },

{ label:"03 AI PCG Scene", html:`
  <div class="sl">
    <p class="kick">03 · 开源</p>
    <h2>AI PCG Scene — 单图到场景的端到端</h2>
    <p class="lead">同一个命题做三遍:给一张参考图,自动生成一个三维场景。三条互相独立的实现互相印证,全部开源。</p>
    <div class="cols media">
      <div class="col"><img class="fig" style="aspect-ratio:16/7" src="assets/img/sc-endpoints.webp" alt="两个终点 — 参考图与 Blender Cycles 重建并排(166 物体 · 480 spp)"><p class="step">线 1 · UE5 资产库匹配</p><h3>AI 提案,规则裁决</h3><p>UE 5.5 内嵌 Python 前馈管线:标定 → 布局 → 材质 → 匹配装配;阶段间只交换 JSON、可断点续跑;失配退化代理盒。127 actors / 0 报错 / 21 库命中 + 9 代理盒。</p></div>
      <div class="col"><img class="fig" style="aspect-ratio:16/8.5;object-fit:contain" src="assets/img/sc-assetlib.webp" alt="39 模块资产库总览 — 实测最长边全落在 75–118 cm 一条带"><p class="step">线 2 · three.js 程序化</p><h3>规则长出场景</h3><p>一张图拆成可生成的规则清单,几何与贴图全部运行时算出;同一份总平面被烘焙与摆放两处消费。44 897 构件 / 每帧 60 draw call,换个种子约 4 秒。</p></div>
      <div class="col"><img class="fig" style="aspect-ratio:16/8.5;object-fit:contain" src="assets/img/sc-layout.webp" alt="解出的实例包围盒回投参考图 — 实例名:模块号 · 32 instances"><p class="step">线 3 · Blender 度量闭环</p><h3>像不像,可测量</h3><p>九轮「渲染 → 度量 → 定位病因 → 改」;消失点解相机、投影回原图逐点核对。边缘 F 0.260 → 0.650;与线 1 外参一比,地平线差 91 px。</p></div>

  </div>` },

{ label:"方法论总图", html:`
  <div class="sl" style="padding:46px 76px 40px">
    <p class="kick" style="margin-bottom:8px">03 · 开源 · 方法论</p>
    <h2 style="font-size:46px;margin-bottom:12px">模型很会说「这是什么」,很不会说「有多大、在哪里」</h2>
    <p style="font-size:19px;color:#c9c0ae;margin-bottom:16px">所以:语义交给模型,几何交给确定性算法;模型给出的几何量只当提示 —— 拿不到它,管线也必须照样出结果。</p>
    <div style="display:flex;flex-direction:column;gap:12px;flex:1;min-height:0;justify-content:space-evenly">
      <div style="border:1.5px dashed #5a9fd6;border-radius:10px;padding:14px 18px 16px">
        <p style="font-size:16px;letter-spacing:.08em;color:#7db8e8;margin-bottom:9px"><b>语义层 · 交给模型</b>　类别 · 支撑关系 · 文字 · 材质倾向 —— 输出只当提示,不进关键路径</p>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px">
          <p style="font-size:15.5px;line-height:1.6;color:#c2b9a8"><b style="color:#ece5d8">单遍欠召回是结构性的。</b>同一份提示词只换 crop 跑四遍召回:整图 21 个,另外三遍补 49 个 = 70;这种漏,调提示词补不回来。</p>
          <p style="font-size:15.5px;line-height:1.6;color:#c2b9a8"><b style="color:#ece5d8">模型报的尺寸只当交叉校验。</b>语义字段人核对过就冻结;模型估的尺寸不参与任何缩放,偏差 > 2 倍只打标记 —— 39 个模块里 25 个中招。</p>
          <p style="font-size:15.5px;line-height:1.6;color:#c2b9a8"><b style="color:#ece5d8">模型的位姿输出只做旁证。</b>九自由度三维盒只给偏航一条交叉证据;让模型写解算器,不要让它看图报数:当估计器用误差 ±30–50%。</p>
        </div>
      </div>
      <div style="border:1.5px solid #4fbf7f;border-radius:10px;padding:14px 18px 16px">
        <p style="font-size:16px;letter-spacing:.08em;color:#6fd39a;margin-bottom:9px"><b>几何层 · 交给确定性算法</b>　尺度 · 位置 · 姿态 —— 这是主干,这条链上不出现模型;可解的几何量不交给模型估</p>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px">
          <p style="font-size:15.5px;line-height:1.6;color:#c2b9a8"><b style="color:#ece5d8">框的取舍靠坐标判据,不靠模型。</b>碰人工切缝的框丢弃,碰真实图边的保留并打「被裁断」标记;前提是重叠带宽于最大跨缝物体。</p>
          <p style="font-size:15.5px;line-height:1.6;color:#c2b9a8"><b style="color:#ece5d8">几何字段永远从实测覆盖。</b>注册表不可信,实测才是裁判:矮桌变体实测顶面比模型低 35 cm,桌上的东西整批悬空。</p>
          <p style="font-size:15.5px;line-height:1.6;color:#c2b9a8"><b style="color:#ece5d8">位姿是「解 + 验」,不是「估」。</b>像素 → 射线 → 与声明的支撑面求交 → 米;换 DCC 改的只是搬运层六件事(手性 / 单位 / 上轴 / 枢轴 / 欧拉序 / FOV 轴)。</p>
        </div>
      </div>
      <div style="border:1.5px solid var(--accent);border-radius:10px;padding:14px 18px 16px">
        <p style="font-size:16px;letter-spacing:.08em;color:var(--accent);margin-bottom:9px"><b>闸门 · 不通过就退回</b>　并把拒收理由记下来 —— 这是这套方法与「一路前馈」的全部区别</p>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px">
          <p style="font-size:15px;line-height:1.55;color:#c2b9a8"><b style="color:#ece5d8">① 受理窗口。</b>hfov 出 [30°,120°] 拒收,出 (35°,110°) 置信 ×0.2;同一张参考图上真的解出过 15° 和 155°。</p>
          <p style="font-size:15px;line-height:1.55;color:#c2b9a8"><b style="color:#ece5d8">② 一致性检查。</b>几个已知高度的物体各自反解机高,取 MAD/median;它只说至少有一个错了 —— 线 1 记了 0.35,照样交付。</p>
          <p style="font-size:15px;line-height:1.55;color:#c2b9a8"><b style="color:#ece5d8">③ 余量门。</b>dD/dpx = h·f / margin²:余量 273 px 解 1.4 m、38 px 解 9.7 m,同一像素误差在两端差 50 倍。</p>
          <p style="font-size:15px;line-height:1.55;color:#c2b9a8"><b style="color:#ece5d8">④ 重投影核对。</b>把解算结果画回参考图,点阵双向投影验渲染器与投影器一致;唯一能抓到全局系统性偏移的手段。</p>
        </div>
        <p style="font-size:14.5px;color:var(--accent);margin-top:8px">任一闸门不过 → 退回上一步重解,而不是带着一个自洽但错误的解继续往下走</p>
      </div>
    </div>
    <div class="foot" style="margin-top:16px"><span>三条实现撞出来的通用做法,不绑定本仓库代码 · 数据可一键复跑导出</span><a class="chip" style="margin-left:auto" href="${L_SCP}"${EXT}>交互文档 ↗</a><a class="chip" href="${L_WBL}"${EXT}>白盒 Live ↗</a></div>
  </div>` },

/* ─────────── shell: render / nav ─────────── */
const cv = document.getElementById('cv'), stage = document.getElementById('stage');
const pgNow = document.getElementById('pgNow'), pgAll = document.getElementById('pgAll');
const prog = document.querySelector('#prog i');
let cur = -1;
pgAll.textContent = SLIDES.length;

function fit() {
  const r = stage.getBoundingClientRect();
  cv.style.transform = 'scale(' + (r.width / 1600) + ')';
}
addEventListener('resize', fit);

function show(i, push) {
  i = Math.max(0, Math.min(SLIDES.length - 1, i));
  if (i === cur) return;
  cur = i;
  const S = SLIDES[i];
  cv.innerHTML = S.html;
  if (S.ov) {
    const box = cv.querySelector('#ovList');
    box.innerHTML = S.ov.map(o =>
      `<div data-go="${o[3]}" style="display:flex;gap:28px;align-items:baseline;padding:25px 6px;border-bottom:1px solid var(--line);cursor:pointer">
        <span style="font-size:19px;color:var(--accent);font-variant-numeric:tabular-nums">${o[0]}</span>
        <span style="font-size:31px;font-family:var(--serif)">${o[1]}</span>
        <span style="margin-left:auto;font-size:17px;color:var(--muted)">${o[2]}</span></div>`).join('');
    box.querySelectorAll('[data-go]').forEach(el =>
      el.addEventListener('click', () => show(+el.dataset.go, true)));
  }
  pgNow.textContent = i + 1;
  prog.style.width = ((i + 1) / SLIDES.length * 100) + '%';
  document.getElementById('btnPrev').disabled = i === 0;
  document.getElementById('btnNext').disabled = i === SLIDES.length - 1;
  document.querySelectorAll('#tocList button').forEach((b, k) => b.classList.toggle('on', k === i));
  document.title = '腾讯工作总结 · 第 ' + (i + 1) + '/' + SLIDES.length + ' 页';
  if (push !== false) history.replaceState(null, '', '#' + (i + 1));
  fit();
  initCmps();
  if (i === SLIDES.length - 1) initDemo();
}
document.getElementById('btnPrev').addEventListener('click', () => show(cur - 1));

/* ─────────── final-page demo: seeded whitebox layout ─────────── */
let demoState = { stage: 0, seed: 20260831 };
function mulberry32(a) { return function() {
  a |= 0; a = a + 0x6D2B79F5 | 0;
  let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function genLayout(seed, roadGap, dens, vegP) {
  const R = mulberry32(seed), W = 640, H = 640;
  const vs = [], hs = [];
  for (let x = 60 + R() * roadGap; x < W - 40; x += roadGap * (0.75 + R() * 0.5)) vs.push(x);
  for (let y = 60 + R() * roadGap; y < H - 40; y += roadGap * (0.75 + R() * 0.5)) hs.push(y);
  const xs = [0, ...vs, W], ys = [0, ...hs, H];
  const cells = [];
  for (let i = 0; i + 1 < xs.length; i++) for (let j = 0; j + 1 < ys.length; j++) {
    const x0 = xs[i] + 8, y0 = ys[j] + 8, w = xs[i + 1] - xs[i] - 16, h = ys[j + 1] - ys[j] - 16;
    if (w < 34 || h < 34) continue;
    const r = R();
    let kind = 'lots';
    if (r < 0.07) kind = 'water'; else if (r < 0.07 + vegP / 100 * 0.55) kind = 'park';
    const cell = { x: x0, y: y0, w, h, kind, walled: kind === 'lots' && R() < 0.22, bld: [], trees: [] };
    if (kind === 'lots') {
      const nx = Math.max(1, Math.round(w / 64)), ny = Math.max(1, Math.round(h / 64));
      for (let a = 0; a < nx; a++) for (let b = 0; b < ny; b++) {
        if (R() * 100 > dens) continue;
        const lw = w / nx, lh = h / ny;
        const bw = lw * (0.45 + R() * 0.4), bh = lh * (0.45 + R() * 0.4);
        cell.bld.push({ x: x0 + a * lw + (lw - bw) / 2 + (R() - 0.5) * 6,
                        y: y0 + b * lh + (lh - bh) / 2 + (R() - 0.5) * 6,
                        w: bw, h: bh, z: 18 + R() * R() * 85 });
      }
      if (!cell.bld.length) cell.kind = 'park';
    }
    if (cell.kind === 'park') {
      const n = 4 + Math.floor(R() * 12 * (0.4 + vegP / 100));
      for (let t = 0; t < n; t++) cell.trees.push({ x: x0 + 8 + R() * (w - 16), y: y0 + 8 + R() * (h - 16), r: 4 + R() * 6 });
    }
    cells.push(cell);
  }
  return { W, H, vs, hs, cells };
}

function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

function drawSem(cx, L, mode) {
  const { W, H } = L, s = cx.canvas.width / W;
  cx.save(); cx.scale(s, s * (cx.canvas.height / cx.canvas.width) * (W / H));
  cx.fillStyle = cssVar('--c-ground'); cx.globalAlpha = mode === 1 ? 0.34 : 1;
  cx.fillRect(0, 0, W, H);
  cx.fillStyle = cssVar('--c-road');
  for (const x of L.vs) cx.fillRect(x - 7, 0, 14, H);
  for (const y of L.hs) cx.fillRect(0, y - 7, W, 14);
  for (const c of L.cells) {
    if (c.kind === 'water') { cx.fillStyle = cssVar('--c-water'); cx.fillRect(c.x, c.y, c.w, c.h); }
    if (c.kind === 'park') { cx.fillStyle = cssVar('--c-veg');
      for (const t of c.trees) { cx.beginPath(); cx.arc(t.x, t.y, t.r, 0, 7); cx.fill(); } }
    if (c.walled) { cx.strokeStyle = cssVar('--c-wall'); cx.lineWidth = 3; cx.strokeRect(c.x, c.y, c.w, c.h); }
    cx.fillStyle = cssVar('--c-building');
    for (const b of c.bld) cx.fillRect(b.x, b.y, b.w, b.h);
  }
  cx.globalAlpha = 1;
  if (mode === 1) { /* vector overlay */
    cx.strokeStyle = '#f5efe2'; cx.lineWidth = 1.6; cx.setLineDash([7, 5]);
    for (const c of L.cells) for (const b of c.bld) cx.strokeRect(b.x, b.y, b.w, b.h);
    cx.setLineDash([]);
    cx.strokeStyle = cssVar('--accent'); cx.lineWidth = 2.2;
    for (const c of L.cells) cx.strokeRect(c.x, c.y, c.w, c.h);
    cx.fillStyle = cssVar('--accent');
    for (const c of L.cells) for (const b of c.bld) { cx.beginPath(); cx.arc(b.x, b.y, 3.4, 0, 7); cx.fill(); }
  }
  cx.restore();
}

function drawIso(cx, L, ghost) {
  const cw = cx.canvas.width, ch = cx.canvas.height;
  cx.clearRect(0, 0, cw, ch);
  const { W, H } = L;
  const px = (x, y, z) => {
    const u = (x - y) / Math.SQRT2, v = (x + y) / (2 * Math.SQRT2) - z;
    return [cw / 2 + u * (cw / (W * 1.55)), ch * 0.24 + v * (ch / (H * 1.18))];
  };
  const quad = (p, fill, stroke) => { cx.beginPath(); cx.moveTo(...p[0]);
    for (let i = 1; i < p.length; i++) cx.lineTo(...p[i]);
    cx.closePath(); if (fill) { cx.fillStyle = fill; cx.fill(); }
    if (stroke) { cx.strokeStyle = stroke; cx.lineWidth = 1; cx.stroke(); } };
  quad([px(0,0,0), px(W,0,0), px(W,H,0), px(0,H,0)], ghost ? '#241f16' : '#3a2f4c');
  cx.globalAlpha = ghost ? 0.35 : 1;
  cx.fillStyle = '#4a4a4a';
  for (const x of L.vs) quad([px(x-7,0,0), px(x+7,0,0), px(x+7,H,0), px(x-7,H,0)], '#3c3c3c');
  for (const y of L.hs) quad([px(0,y-7,0), px(0,y+7,0), px(W,y+7,0), px(W,y-7,0)], '#3c3c3c');
  for (const c of L.cells) {
    if (c.kind === 'water') quad([px(c.x,c.y,0), px(c.x+c.w,c.y,0), px(c.x+c.w,c.y+c.h,0), px(c.x,c.y+c.h,0)], '#0f6a74');
  }
  cx.globalAlpha = 1;
  if (!ghost) {
    const items = [];
    for (const c of L.cells) {
      for (const b of c.bld) items.push({ d: b.x + b.y, f: () => {
        const {x, y, w, h, z} = b;
        quad([px(x,y+h,0), px(x+w,y+h,0), px(x+w,y+h,z)], null);
        quad([px(x,y+h,z), px(x+w,y+h,z), px(x+w,y+h,0), px(x,y+h,0)], '#8f3030');
        quad([px(x+w,y,z), px(x+w,y+h,z), px(x+w,y+h,0), px(x+w,y,0)], '#b74040');
        quad([px(x,y,z), px(x+w,y,z), px(x+w,y+h,z), px(x,y+h,z)], '#e0dcd2', '#8a867c');
      }});
      for (const t of c.trees) items.push({ d: t.x + t.y, f: () => {
        const [bx, by] = px(t.x, t.y, 0);
        cx.fillStyle = '#2E8B2E'; cx.beginPath();
        cx.moveTo(bx, by - t.r * 3.2); cx.lineTo(bx - t.r, by); cx.lineTo(bx + t.r, by);
        cx.closePath(); cx.fill();
      }});
    }
    items.sort((a, b) => a.d - b.d).forEach(i => i.f());
  }
}

function runDemo() {
  const sem = document.getElementById('cvSem');
  if (!sem) return;
  const r = sem.getBoundingClientRect(), d = devicePixelRatio || 1;
  sem.width = Math.max(60, r.width * d); sem.height = Math.max(60, r.height * d);
  const L = genLayout(demoState.seed, 150, 65, 30);
  const cx = sem.getContext('2d'); cx.clearRect(0, 0, sem.width, sem.height);
  if (demoState.stage < 2) drawSem(cx, L, demoState.stage);
  else drawIso(cx, L, false);
  let nb = 0, nt = 0;
  for (const c of L.cells) { nb += c.bld.length; nt += c.trees.length; }
  const st = document.getElementById('demoStat');
  if (st) st.textContent = 'seed ' + demoState.seed + ' · ' + nb + ' 建筑 · ' + nt + ' 植被';
}

/* GeoGen terrain: seeded fBm heightfield → hillshade / biome */
let ggState = { seed: 512, mode: 1 };
function ggField(seed) {
  const R = mulberry32(seed), N = 96;
  const oct = [];
  for (let o = 0; o < 4; o++) {
    const n = 4 << o, g = [];
    for (let i = 0; i <= n; i++) { g.push([]); for (let j = 0; j <= n; j++) g[i].push(R()); }
    oct.push({ n, g });
  }
  const H = [];
  for (let y = 0; y < N; y++) { H.push([]);
    for (let x = 0; x < N; x++) {
      let v = 0, amp = 1, tot = 0;
      for (const { n, g } of oct) {
        const fx = x / (N - 1) * n, fy = y / (N - 1) * n;
        const ix = Math.min(n - 1, fx | 0), iy = Math.min(n - 1, fy | 0);
        const tx = fx - ix, ty = fy - iy;
        const sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
        const v00 = g[iy][ix], v10 = g[iy][ix + 1], v01 = g[iy + 1][ix], v11 = g[iy + 1][ix + 1];
        v += ((v00 * (1 - sx) + v10 * sx) * (1 - sy) + (v01 * (1 - sx) + v11 * sx) * sy) * amp;
        tot += amp; amp *= 0.5;
      }
      H[y].push(v / tot);
    }
  }
  for (let it = 0; it < 2; it++)  /* 轻量“侵蚀”:一次平滑 + 谷底加深 */
    for (let y = 1; y < N - 1; y++) for (let x = 1; x < N - 1; x++)
      H[y][x] = H[y][x] * 0.6 + (H[y - 1][x] + H[y + 1][x] + H[y][x - 1] + H[y][x + 1]) * 0.1;
  return { H, N };
}
function runGG() {
  const cv2 = document.getElementById('cvGG');
  if (!cv2) return;
  const r = cv2.getBoundingClientRect(), d = devicePixelRatio || 1;
  cv2.width = Math.max(60, r.width * d); cv2.height = Math.max(60, r.height * d);
  const { H, N } = ggField(ggState.seed);
  const cx = cv2.getContext('2d');
  const img = cx.createImageData(cv2.width, cv2.height);
  const SEA = 0.42;
  for (let py = 0; py < cv2.height; py++) for (let px = 0; px < cv2.width; px++) {
    const x = Math.min(N - 1, px / cv2.width * N | 0), y = Math.min(N - 1, py / cv2.height * N | 0);
    const h = H[y][x];
    const gx = H[y][Math.min(N - 1, x + 1)] - h, gy = H[Math.min(N - 1, y + 1)][x] - h;
    const shade = Math.max(0.25, Math.min(1.25, 0.85 + (gx - gy) * 9));
    let R2, G2, B2;
    if (ggState.mode === 0) { const v = h * 255 | 0; R2 = G2 = B2 = v; }
    else if (ggState.mode === 1) {
      if (h < SEA) { R2 = 26; G2 = 62; B2 = 84; }
      else { const t = (h - SEA) / (1 - SEA);
        R2 = (120 + t * 130) * shade; G2 = (104 + t * 125) * shade; B2 = (84 + t * 120) * shade; }
    } else {
      if (h < SEA) { R2 = 20; G2 = 90; B2 = 160; }
      else if (h > 0.8) { R2 = 240; G2 = 244; B2 = 248; }
      else if (h > 0.7) { R2 = 150; G2 = 150; B2 = 150; }
      else if (h > 0.55) { R2 = 34; G2 = 110; B2 = 46; }
      else { R2 = 214; G2 = 206; B2 = 90; }
      if (h >= SEA) { R2 *= shade; G2 *= shade; B2 *= shade; }
    }
    const i = (py * cv2.width + px) * 4;
    img.data[i] = R2; img.data[i + 1] = G2; img.data[i + 2] = B2; img.data[i + 3] = 255;
  }
  cx.putImageData(img, 0, 0);
  const st = document.getElementById('ggStat');
  if (st) st.textContent = 'seed ' + ggState.seed;
}
function initDemo() {
  demoState.stage = 0;
  cv.querySelectorAll('button[data-st]').forEach(b => {
    b.classList.toggle('on', b.dataset.st === '0');
    b.onclick = () => { demoState.stage = +b.dataset.st;
      cv.querySelectorAll('button[data-st]').forEach(x => x.classList.toggle('on', x === b)); runDemo(); };
  });
  const sd = document.getElementById('btnSeed');
  if (sd) sd.onclick = () => { demoState.seed = 1 + Math.floor(Math.random() * 99999999); runDemo(); };
  const gs = document.getElementById('btnGGSeed');
  if (gs) gs.onclick = () => { ggState.seed = 1 + Math.floor(Math.random() * 99999999); runGG(); };
  cv.querySelectorAll('button[data-gg]').forEach(b => {
    b.onclick = () => { ggState.mode = +b.dataset.gg;
      cv.querySelectorAll('button[data-gg]').forEach(x => x.classList.toggle('on', x === b)); runGG(); };
  });
  cv.querySelectorAll('button[data-vg]').forEach(b => {
    b.onclick = () => { document.getElementById('vgFrame').src = 'assets/img/vg-b' + b.dataset.vg + '.webp';
      document.getElementById('vgCap').textContent = b.dataset.cap;
      cv.querySelectorAll('button[data-vg]').forEach(x => x.classList.toggle('on', x === b)); };
  });
  cv.querySelectorAll('button[data-vid]').forEach(b => {
    b.onclick = () => { const v = document.getElementById('pgVideo');
      v.pause(); v.src = b.dataset.vid; v.poster = b.dataset.pos; v.load();
      cv.querySelectorAll('button[data-vid]').forEach(x => x.classList.toggle('on', x === b)); };
  });
  runDemo(); runGG();
  setTimeout(() => { runDemo(); runGG(); }, 120); // fonts/layout settle
}
addEventListener('resize', () => { if (cur === SLIDES.length - 1) { runDemo(); runGG(); } });

/* compare sliders (参考 geogen.html 的划拉对比) */
function initCmps() {
  cv.querySelectorAll('.cmp').forEach(c => {
    const b = c.querySelector('img.b'), bar = c.querySelector('.bar');
    const setF = f => { f = Math.max(0.03, Math.min(0.97, f));
      b.style.clipPath = 'inset(0 0 0 ' + (f * 100) + '%)'; bar.style.left = (f * 100) + '%'; };
    setF(0.5);
    const move = e => { const r = c.getBoundingClientRect(); setF((e.clientX - r.left) / r.width); };
    c.addEventListener('pointerdown', e => { c.setPointerCapture(e.pointerId); move(e); });
    c.addEventListener('pointermove', e => { if (e.buttons) move(e); });
  });
  cv.querySelectorAll('button[data-cmp]').forEach(btn => {
    btn.addEventListener('click', () => {
      const c = document.getElementById(btn.dataset.cmp);
      c.querySelector('img.b').src = btn.dataset.src;
      c.querySelector('.tagR').textContent = btn.dataset.name;
      btn.parentElement.querySelectorAll('button[data-cmp]').forEach(x => x.classList.toggle('on', x === btn));
    });
  });
}

/* lightbox: click any .fig to zoom */
const lb = document.getElementById('lb');
document.addEventListener('click', e => {
  if (e.target.closest('#lb')) { lb.classList.remove('on'); return; }
  const f = e.target.closest('img.fig');
  if (f) { lb.querySelector('img').src = f.src; lb.querySelector('p').textContent = f.alt || ''; lb.classList.add('on'); }
});
addEventListener('keydown', e => { if (e.key === 'Escape') lb.classList.remove('on'); });

const n0 = parseInt(location.hash.slice(1));
show(n0 ? n0 - 1 : 0, false);
